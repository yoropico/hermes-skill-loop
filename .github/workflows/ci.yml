name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is what macOS ships as /usr/bin/python3, and hooks run under it.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - name: scripts import cleanly on this interpreter
        run: |
          cd scripts
          python -c "import runlog, curator, learn, usage, skill_meta"
          python -m py_compile migrate-off-bct.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin + hook manifests are valid JSON and agree
        run: |
          python - <<'PY'
          import json
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          hooks  = json.load(open("hooks/hooks.json"))
          names = [p["name"] for p in market["plugins"]]
          assert plugin["name"] in names, (plugin["name"], names)
          events = set(hooks["hooks"])
          assert events == {"SessionEnd", "PreToolUse"}, events
          cmds = [h["command"] for es in hooks["hooks"].values() for e in es for h in e["hooks"]]
          assert all("${CLAUDE_PLUGIN_ROOT}" in c for c in cmds), cmds
          print("manifests OK:", plugin["name"], plugin["version"])
          PY
